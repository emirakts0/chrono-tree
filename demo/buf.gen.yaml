version: v2
# The buf.validate descriptor comes from the buf.build/gen/go/bufbuild/protovalidate
# module dependency — do not generate a local copy (double registration panics at init).
inputs:
  - directory: .
plugins:
  - local: protoc-gen-go
    out: api/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: api/gen
    opt: paths=source_relative
