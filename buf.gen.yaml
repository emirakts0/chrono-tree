version: v2
# The second input generates api/gen/buf/validate/validate.pb.go from the
# protovalidate module; buf v2 only generates workspace files by default.
inputs:
  - directory: .
  - module: buf.build/bufbuild/protovalidate
    paths:
      - buf/validate
plugins:
  - local: protoc-gen-go
    out: api/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: api/gen
    opt: paths=source_relative
