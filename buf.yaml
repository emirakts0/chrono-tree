version: v2
modules:
  - path: api/proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  except:
    # The API intentionally reuses shared message types across streaming RPCs
    # (Trigger, TickBatch, FeedStatus, CatalogRequest/CatalogReply); later
    # tasks depend on exactly these names.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
